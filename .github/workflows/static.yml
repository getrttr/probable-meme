name: Deploy static content to Pages

on:
  push:
    branches: ["main"] # или ваша основная ветка

permissions:
  contents: read
  pages: write
  id-token: write

# ... (начало файла остается прежним)

jobs:
  deploy:
    environment:
      name: github-pages
      # Ссылаемся на новый ID шага:
      url: ${{ steps.gh-deploy.outputs.page_url }} 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        # Изменяем ID здесь, чтобы он не конфликтовал:
        id: gh-deploy 
        uses: actions/deploy-pages@v4
